name: Release macOS

on:
  workflow_call:
    inputs:
      tag:
        description: Existing git tag, for example v2.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Sign, notarize, and package
    runs-on: macos-26
    environment: macos-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Require signing secrets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${APPLE_CERTIFICATE_P12}" ] || missing+=("APPLE_CERTIFICATE_P12")
          [ -n "${APPLE_CERTIFICATE_PASSWORD}" ] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -n "${APPLE_TEAM_ID}" ] || missing+=("APPLE_TEAM_ID")
          [ -n "${APPLE_API_KEY_ID}" ] || missing+=("APPLE_API_KEY_ID")
          [ -n "${APPLE_API_ISSUER_ID}" ] || missing+=("APPLE_API_ISSUER_ID")
          [ -n "${APPLE_API_KEY_P8}" ] || missing+=("APPLE_API_KEY_P8")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Release signing secrets are missing: ${missing[*]}"
            echo "Refusing to archive, sign, notarize, or publish an unsigned build."
            exit 1
          fi
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
          xcodebuild -version
      - name: Check version tag
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);/\1/p' macos/Mote.xcodeproj/project.pbxproj | head -n 1 | tr -d ' ')
          tag="${{ inputs.tag }}"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match MARKETING_VERSION $version. Refusing to publish."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mote-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -p codesigning "$RUNNER_TEMP/mote-signing.keychain-db" | sed -n 's/.*"\(Developer ID Application: [^"]*\)"/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "Temporary keychain has no Developer ID Application identity."
            exit 1
          fi
          xcodebuild archive \
            -project macos/Mote.xcodeproj \
            -scheme Mote \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Mote.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=$IDENTITY" \
            CODE_SIGN_ENTITLEMENTS=Mote/Resources/Mote.entitlements \
            ENABLE_HARDENED_RUNTIME=YES \
            ENABLE_APP_SANDBOX=NO \
            OTHER_CODE_SIGN_FLAGS=--timestamp
      - name: Export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string developer-id" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Developer ID Application" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" "$PLIST"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mote.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$PLIST"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/export/Mote.app"
      - name: Notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Mote.app" "$RUNNER_TEMP/Mote-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Mote-notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/export/Mote.app"
          xcrun stapler validate "$RUNNER_TEMP/export/Mote.app"
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/Mote-notarize.zip"
      - name: Package zip and checksum
        run: |
          set -euo pipefail
          mkdir -p dist/release
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Mote.app" "dist/release/Mote-macOS-${{ steps.version.outputs.version }}.zip"
          (
            cd dist/release
            shasum -a 256 "Mote-macOS-${{ steps.version.outputs.version }}.zip" > "Mote-macOS-${{ steps.version.outputs.version }}.sha256"
          )
          printf '%s\n' "{\"product\":\"Mote\",\"platform\":\"macos\",\"version\":\"${{ steps.version.outputs.version }}\",\"notarization\":\"succeeded\"}" > dist/release/macos-release-evidence.json
      - name: Upload signed Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            dist/release/Mote-macOS-*.zip
            dist/release/Mote-macOS-*.sha256
            dist/release/macos-release-evidence.json
      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mote-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist"
